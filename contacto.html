<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIAN Robotics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <div class="logo">CIAN Robotics</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="noticias.html">Noticias</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <!-- Sección Hero -->
  <section class="hero" id="inicio">
    <div class="hero-text">
      <h1>Automatización Inteligente para la Industria</h1>
      <p>CIAN Robotics: haciendo la automatización más fácil y eficiente.</p>
    </div>
  </section>

<section class="contact-section">
  
  <!-- Publicación de Instagram -->
  <div>
    <blockquote class="instagram-media" 
            data-instgrm-permalink="https://www.instagram.com/cian_robotics/" 
            data-instgrm-version="14">
    </blockquote>
    <script async src="//www.instagram.com/embed.js"></script>


  </div>

  <!-- Formulario de contacto -->
  <div>
    <h3>Formulario de contacto</h3>
    <form>
      
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono">

      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="asunto">Asunto:</label>
      <input type="text" id="asunto" name="asunto">

      <label for="mensaje">Texto:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit" class="btn-submit">Enviar</button>
    </form>
  </div>

</section>


  <!-- Pie de página -->
  <footer>
    <p>&copy; 2025 CIAN Robotics - Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
